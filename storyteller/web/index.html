<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playable stories</title>
    <meta
      name="description"
      content="A shelf of playable stories told by a storyteller that answers every line you write."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <section class="shelf" id="shelf-view">
        <header class="shelf-head">
          <div class="shelf-intro">
            <h1 id="shelf-title">Playable stories</h1>
            <p id="shelf-lede"></p>
          </div>
          <button id="shelf-language" class="quiet" type="button" aria-label="Switch language">
            中文
          </button>
        </header>
        <ul class="shelf-list" id="shelf-list" aria-label="Stories"></ul>
        <p class="message" id="shelf-message" role="status"></p>
      </section>

      <section class="story" id="story-view" hidden>
        <header class="top">
          <div class="title">
            <button id="back" class="back" type="button">All stories</button>
            <h1 id="story-title">Playable story</h1>
            <p id="story-subtitle"></p>
          </div>
          <div class="controls">
            <button id="restart" class="ghost" type="button">Restart</button>
            <button id="language" type="button" aria-label="Switch language">中文</button>
          </div>
        </header>

        <div class="status" aria-live="polite">
          <span id="loop-label"></span>
          <span id="turn-label"></span>
        </div>

        <main id="log" aria-live="polite" aria-label="Story"></main>

        <section class="composer" id="composer">
          <div class="mode" role="group" aria-label="Input mode">
            <button type="button" data-mode="say" aria-pressed="true" id="mode-say">Say</button>
            <button type="button" data-mode="do" aria-pressed="false" id="mode-do">Do</button>
          </div>
          <div class="input-row">
            <label class="sr-only" for="action" id="input-label">Your line or action</label>
            <textarea
              id="action"
              rows="1"
              maxlength="400"
              placeholder="One line you say…"
              autocomplete="off"
            ></textarea>
            <button class="primary" id="send" type="button">Send</button>
          </div>
          <div class="hints" id="hints"></div>
          <p class="message" id="message" role="status"></p>
        </section>

        <footer class="note" id="note"></footer>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
