<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playable story</title>
    <meta
      name="description"
      content="A playable story in which a storyteller judges every word and action."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="title">
          <h1 id="story-title">Playable story</h1>
          <p id="story-subtitle"></p>
        </div>
        <div class="controls">
          <button id="restart" class="ghost" type="button">Restart</button>
          <button id="language" type="button" aria-label="Switch language">中文</button>
        </div>
      </header>

      <div class="status" aria-live="polite">
        <span id="day-label">Day 1</span>
        <span id="phase-label">morning</span>
        <span class="clock" id="clock" aria-hidden="true"></span>
        <span id="remaining-label"></span>
      </div>

      <main id="log" aria-live="polite" aria-label="Story"></main>

      <section class="ending" id="ending" hidden>
        <h2 id="ending-title">The loop has ended</h2>
        <p id="ending-text"></p>
      </section>

      <section class="composer" id="composer">
        <div class="mode" role="group" aria-label="Input mode">
          <button type="button" data-mode="say" aria-pressed="true" id="mode-say">Say</button>
          <button type="button" data-mode="do" aria-pressed="false" id="mode-do">Do</button>
        </div>
        <div class="input-row">
          <label class="sr-only" for="action">Your line or action</label>
          <textarea
            id="action"
            rows="1"
            maxlength="400"
            placeholder="One line the fox says…"
            autocomplete="off"
          ></textarea>
          <button class="primary" id="send" type="button">Send</button>
        </div>
        <div class="hints" id="hints"></div>
        <p class="message" id="message" role="status"></p>
      </section>

      <footer class="note" id="note">
        A storyteller reads each line and decides what it changes. Nothing is
        scripted in advance.
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
